services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /srv/data/leads.sqlite3
      SITE_URL: ${SITE_URL}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    volumes:
      - leads_data:/srv/data
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  leads_data:
  caddy_data:
  caddy_config:
